<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Which Miyazaki Character Are You?</title>
  <meta name="description" content="A 40-question, whimsical personality quiz that matches you to characters from the films of Hayao Miyazaki.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Painted scenery: sky, sun/moon, drifting clouds, rolling hills, floating motes -->
  <div class="scenery" aria-hidden="true">
    <div class="sun"></div>
    <div class="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="hill-far" d="M0,190 C180,120 340,150 520,170 C720,195 860,110 1060,120 C1220,128 1340,170 1440,160 L1440,320 L0,320 Z"/>
      <path class="hill-mid" d="M0,240 C160,200 300,215 470,235 C640,255 780,190 980,200 C1160,209 1300,245 1440,230 L1440,320 L0,320 Z"/>
      <path class="hill-near" d="M0,285 C200,260 380,270 560,282 C760,296 940,258 1140,265 C1290,270 1380,285 1440,282 L1440,320 L0,320 Z"/>
    </svg>
    <div class="motes"></div>
  </div>

  <main id="app" aria-live="polite"></main>

  <script src="app.js"></script>
</body>
</html>
