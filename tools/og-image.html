<!doctype html>
<!-- Source for og-image.png (the link-preview card). Regenerate with:
     node tools/render-og.js -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: linear-gradient(180deg, #8ec5e6 0%, #c4e3ee 50%, #fbeed3 100%); font-family: "Fraunces", Georgia, serif; color: #3a3326; }
  .sun { position: absolute; top: 46px; right: 110px; width: 120px; height: 120px; border-radius: 50%; background: #fff4c9;
    box-shadow: 0 0 60px 30px rgba(255,230,160,.65), 0 0 140px 80px rgba(255,230,160,.5); }
  .cloud { position: absolute; width: 200px; height: 60px; background: #fff; border-radius: 60px; opacity: .92; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 90px; height: 90px; top: -45px; left: 30px; }
  .cloud::after { width: 120px; height: 120px; top: -70px; left: 80px; }
  svg.hills { position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; }
  .card { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); width: 900px; text-align: center;
    background: #fffaf0; border-radius: 40px 48px 36px 44px / 44px 36px 48px 40px; padding: 38px 40px 34px;
    box-shadow: 0 3px 0 #efe2c6, 0 30px 60px -24px rgba(70,60,30,.5); }
  .eyebrow { font-family: "Patrick Hand", cursive; font-size: 30px; color: #7d705a; margin: 0; }
  h1 { font-size: 72px; line-height: 1.05; margin: 6px 0 24px; letter-spacing: -.01em; }
  .row { display: flex; justify-content: center; gap: 18px; }
  .leaf { position: absolute; top: -26px; left: 40px; font-size: 48px; transform: rotate(-20deg); }
</style></head>
<body>
  <div class="sun"></div>
  <div class="cloud" style="top:120px;left:40px;transform:scale(1.2)"></div>
  <div class="cloud" style="top:300px;left:1010px;transform:scale(.8);opacity:.8"></div>
  <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <path fill="#a9cfa0" d="M0,190 C180,120 340,150 520,170 C720,195 860,110 1060,120 C1220,128 1340,170 1440,160 L1440,320 L0,320 Z"/>
    <path fill="#7fb47c" d="M0,240 C160,200 300,215 470,235 C640,255 780,190 980,200 C1160,209 1300,245 1440,230 L1440,320 L0,320 Z"/>
    <path fill="#5c9a63" d="M0,285 C200,260 380,270 560,282 C760,296 940,258 1140,265 C1290,270 1380,285 1440,282 L1440,320 L0,320 Z"/>
  </svg>
  <div class="card">
    <div class="leaf">🍃</div>
    <p class="eyebrow">A whimsical 40-question journey</p>
    <h1>Which Miyazaki Character<br>Are You?</h1>
    <div class="row" id="row"></div>
  </div>
  <script src="../emblems.js"></script>
  <script>
    for (const id of ["kiki", "howl", "nausicaa", "ponyo", "haku", "porco", "chihiro"])
      document.getElementById("row").insertAdjacentHTML("beforeend", emblemSVG(id, 96));
  </script>
</body></html>
